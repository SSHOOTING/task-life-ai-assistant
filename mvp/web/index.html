<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVP 今日任务</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; color: #202124; }
  textarea { width: 100%; min-height: 110px; box-sizing: border-box; padding: 12px; font-size: 16px; }
  button { margin: 8px 8px 8px 0; padding: 8px 14px; cursor: pointer; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .kind { display: inline-block; font-size: 12px; background: #eef2ff; color: #364fc7; padding: 2px 8px; border-radius: 999px; }
  .muted { color: #666; font-size: 14px; }
  pre { white-space: pre-wrap; background: #f7f7f7; padding: 12px; border-radius: 8px; }
</style>
<h1>MVP 今日任务</h1>
<p class="muted">固定输入：今天背完单词了，论文开头也改了，跟朋友聊完没那么焦虑了。</p>
<textarea id="input">今天背完单词了，论文开头也改了，跟朋友聊完没那么焦虑了。</textarea>
<div>
  <button id="send">发送</button>
  <button id="refresh">刷新</button>
</div>
<pre id="receipt">等待输入…</pre>
<h2>今日任务</h2>
<div id="tasks"></div>
<h2>未解析原话</h2>
<div id="failed"></div>
<script>
const userId = "U-DEMO-001";
const kindLabels = {task:"任务", daily_task:"每日任务", task_progress:"任务进展"};

function today() {
  return new Date().toLocaleDateString("sv-SE");
}

async function send() {
  const content = document.getElementById("input").value.trim();
  if (!content) return;
  const receipt = document.getElementById("receipt");
  receipt.textContent = "处理中…";
  try {
    const response = await fetch("/api/v1/turns", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        user_id: userId,
        source: "h5",
        source_message_id: crypto.randomUUID(),
        content
      })
    });
    const data = await response.json();
    receipt.textContent = JSON.stringify(data, null, 2);
    await refresh();
  } catch (error) {
    receipt.textContent = "请求失败：" + error.message;
  }
}

async function refresh() {
  try {
    const [taskResponse, failedResponse] = await Promise.all([
      fetch(`/api/v1/tasks?user_id=${encodeURIComponent(userId)}&date=${today()}`),
      fetch(`/api/v1/events?user_id=${encodeURIComponent(userId)}&parse_status=failed`)
    ]);
    const taskData = await taskResponse.json();
    const failedData = await failedResponse.json();
    const tasksRoot = document.getElementById("tasks");
    const failedRoot = document.getElementById("failed");
    tasksRoot.innerHTML = "";
    failedRoot.innerHTML = "";

    for (const task of taskData.data.tasks || []) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<span class="kind">${kindLabels[task.kind] || task.kind}</span>
        <strong>${escapeHtml(task.title || task.content)}</strong>
        <div class="muted">${escapeHtml(task.status)} · ${escapeHtml(task.occurred_on || "")}</div>
        <p>${escapeHtml(task.content)}</p>`;
      if (task.status !== "revoked") {
        const btn = document.createElement("button");
        btn.textContent = "撤销";
        btn.onclick = async () => {
          await fetch("/api/v1/corrections", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              user_id: userId,
              source: "h5",
              source_message_id: crypto.randomUUID(),
              target_record_id: task.record_id,
              content: "撤销这条记录",
              changes: {status: "revoked", revoked_at: new Date().toISOString()}
            })
          });
          await refresh();
        };
        card.appendChild(btn);
      }
      tasksRoot.appendChild(card);
    }

    for (const event of failedData.data.events || []) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<span class="kind">待处理</span>
        <div class="muted">${escapeHtml(event.created_at)}</div>
        <p>${escapeHtml(event.content)}</p>
        <pre>${escapeHtml(event.parse_result_json || event.response_payload_json || "")}</pre>`;
      failedRoot.appendChild(card);
    }
  } catch (error) {
    document.getElementById("receipt").textContent = "刷新失败：" + error.message;
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

document.getElementById("send").onclick = send;
document.getElementById("refresh").onclick = refresh;
refresh();
</script>
</html>
